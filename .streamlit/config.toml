[theme]
primaryColor = "#0099FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#FFFFFF"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
enableWebsocketCompression = false
websocketPingInterval = 20

[runner]
fastReruns = false
