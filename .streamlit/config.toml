[theme]
primaryColor = "#0099FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#FFFFFF"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
enableWebsocketCompression = false
# uvicorn 0.43 ping_timeout = interval. 20s Cloud soğuk açılışta
# keepalive ping timeout ile siyah ekran bırakıyor (Python 3.14 import).
websocketPingInterval = 55

[runner]
fastReruns = false
